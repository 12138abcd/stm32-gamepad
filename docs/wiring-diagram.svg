<text x="904" y="1158" font-size="14.5" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">“上/下/左/右”指的是手柄上十字键的位置；A 在最下、Y 在最上。</text>
<text x="52" y="1224" font-size="16" fill="#1f2328" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">焊完先量再上电：</text>
<text x="190" y="1224" font-size="16" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">万用表蜂鸣档，按键【没按时应不通、按下时应通】—— 这一步能提前发现虚焊和接错脚。</text>
