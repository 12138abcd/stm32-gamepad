<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1250" viewBox="0 0 1640 1250">
<rect x="0" y="0" width="1640" height="1250" fill="#f2f4f7"/>
<text x="52" y="56" font-size="29" fill="#1f2328" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">STM32 手柄 · 按键接线图（第 3 步：把 8 个按键焊到蓝板上）</text>
<text x="52" y="90" font-size="17" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">8 根信号线 + 1 根公共地线，全部接在蓝板【右侧】那一排排针上 —— 不用跨到左边那排</text>
<rect x="40" y="116" width="800" height="1064" fill="#ffffff" rx="12" stroke="#ccd2da" stroke-width="1.5"/>
<text x="64" y="156" font-size="21" fill="#1f2328" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">① 蓝板右侧排针 —— 哪个脚接哪个按键</text>
<text x="64" y="184" font-size="15" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">USB 口朝上放，右手边那一排，从上到下 21 个脚</text>
<rect x="64" y="200" width="752" height="40" fill="#fff8ec" rx="8" stroke="#f3c98b" stroke-width="1.5"/>
<text x="78" y="226" font-size="14.5" fill="#b54708" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">排针上有丝印 —— 按【名字】找脚，不要按第几个去数（不同批次顺序可能不同）</text>
<rect x="64" y="256" width="752" height="36" fill="#fafbfc" rx="5"/>
<rect x="64" y="256" width="112" height="36" fill="#eef1f4" rx="5"/>
