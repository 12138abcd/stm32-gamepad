<text x="1326" y="240" font-size="15" fill="#2f9e44" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle" font-weight="bold">3</text>
<text x="1326" y="324" font-size="15" fill="#2f9e44" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle" font-weight="bold">4</text>
<text x="1376" y="284" font-size="22" fill="#2f9e44" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle" font-weight="bold">B</text>
<text x="904" y="376" font-size="16" fill="#1f2328" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">左侧 1、2 内部相通（节点 A）；右侧 3、4 内部相通（节点 B）。</text>
<text x="904" y="404" font-size="16" fill="#1f2328" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">所以取【对角】两个脚 —— 1+4 或 2+3：一个接 GPIO，另一个接 GND。</text>
<rect x="904" y="508" width="672" height="72" fill="#fff3f2" rx="8" stroke="#f5b5b0" stroke-width="1.5"/>
<text x="920" y="536" font-size="16" fill="#d92d20" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">别把同一侧的两个脚分别接 GPIO 和 GND ——</text>
<text x="920" y="562" font-size="16" fill="#d92d20" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">它们本来就连着，等于这个键永远按下，joy.cpl 里那个按钮会一直亮。</text>
<rect x="880" y="620" width="720" height="560" fill="#ffffff" rx="12" stroke="#ccd2da" stroke-width="1.5"/>
<text x="904" y="660" font-size="21" fill="#1f2328" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">③ 按键实际排布（俯视）—— 哪个开关是哪个</text>
<text x="904" y="686" font-size="15" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">左手十字键（绿）　右手面键（橙）　每个键标出它接哪根线</text>
