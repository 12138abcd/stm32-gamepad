<text x="196" y="827" font-size="15.5" fill="#d92d20" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">避开 —— 默认被 JTAG 占着</text>
<rect x="64" y="841" width="752" height="36" fill="#fff3f2" rx="5"/>
<rect x="64" y="841" width="112" height="36" fill="#d92d20" rx="5"/>
