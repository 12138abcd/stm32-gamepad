<text x="196" y="281" font-size="15.5" fill="#98a2b3" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">不用</text>
<rect x="64" y="295" width="752" height="36" fill="#e7f0ff" rx="5"/>
<rect x="64" y="295" width="112" height="36" fill="#1668dc" rx="5"/>
