<text x="64" y="1101" font-size="14.5" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">颜色：绿 = 要接按键的信号脚　　蓝 = 公共地　　红 = 绝对不要用</text>
<rect x="880" y="116" width="720" height="484" fill="#ffffff" rx="12" stroke="#ccd2da" stroke-width="1.5"/>
<text x="904" y="156" font-size="21" fill="#1f2328" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start" font-weight="bold">② 轻触开关的 4 个脚 —— 只有 2 个电气节点</text>
<text x="904" y="182" font-size="15" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start">最容易翻车的一点：4 个脚看着像 4 个接点，其实两两内部相通</text>
<rect x="1130" y="224" width="150" height="108" fill="#e9ecef" rx="10" stroke="#868e96" stroke-width="2"/>
<text x="1205" y="270" font-size="15" fill="#5b6470" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle">轻触开关</text>
<text x="1205" y="298" font-size="13" fill="#98a2b3" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle">（按下把 A、B 接通）</text>
